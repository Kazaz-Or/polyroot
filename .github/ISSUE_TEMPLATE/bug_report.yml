name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: {required: true}
  - type: textarea
    id: command
    attributes:
      label: Output of `polyroot command <workspace> --agent <agent>`
      description: Redact private paths if needed.
      render: text
  - type: textarea
    id: doctor
    attributes:
      label: Output of `polyroot doctor` and `polyroot --version`
      render: text
    validations: {required: true}
  - type: input
    id: os
    attributes:
      label: OS and architecture
      placeholder: macOS 15 arm64 / Ubuntu 24.04 amd64
    validations: {required: true}
