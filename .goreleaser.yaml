version: 2

project_name: polyroot

builds:
  - main: ./cmd/polyroot
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Version}}"]

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md, CHANGELOG.md, examples/**/*]

checksum:
  name_template: checksums.txt

changelog:
  use: github
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]

release:
  github:
    owner: Kazaz-Or
    name: polyroot
  draft: true      # the Release workflow publishes it unless "draft" is chosen
  prerelease: auto  # v1.2.0-rc.1 is marked as a pre-release
