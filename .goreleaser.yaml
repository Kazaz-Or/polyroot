version: 2

project_name: polyroot

builds:
  - main: ./cmd/polyroot
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Version}}"]

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md, CHANGELOG.md, examples/**/*]

checksum:
  name_template: checksums.txt

# Release notes: commits since the previous tag, grouped by Conventional
# Commit type (feat:, fix:, docs:, ...), each with its author and link.
changelog:
  use: github
  sort: asc
  groups:
    - title: "🚀 Features"
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: "🐛 Bug fixes"
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: "🔒 Security"
      regexp: '^.*?(sec|security)(\(.+\))??!?:.+$'
      order: 2
    - title: "⚡ Performance"
      regexp: '^.*?perf(\(.+\))??!?:.+$'
      order: 3
    - title: "📚 Documentation"
      regexp: '^.*?docs(\(.+\))??!?:.+$'
      order: 4
    - title: "🔧 Maintenance"
      regexp: '^.*?(chore|ci|build|refactor|test|deps)(\(.+\))??!?:.+$'
      order: 5
    - title: "Other changes"
      order: 999
  filters:
    exclude:
      - "^Merge (pull request|branch)"

release:
  github:
    owner: Kazaz-Or
    name: polyroot
  draft: true      # the Release workflow publishes it unless "draft" is chosen
  prerelease: auto  # v1.2.0-rc.1 is marked as a pre-release
  name_template: "Polyroot {{ .Tag }}"
  header: |
    ## Polyroot {{ .Tag }}

    Multi-repo workspaces for coding agents. Full documentation: [README](https://github.com/Kazaz-Or/polyroot/blob/{{ .Tag }}/README.md) · [Changelog](https://github.com/Kazaz-Or/polyroot/blob/{{ .Tag }}/CHANGELOG.md)

    ### Install

    ```bash
    curl -fsSL https://raw.githubusercontent.com/Kazaz-Or/polyroot/master/install.sh | POLYROOT_VERSION={{ .Tag }} sh
    ```

    or `go install github.com/Kazaz-Or/polyroot/cmd/polyroot@{{ .Tag }}`

    ### Downloads

    | Platform | Archive |
    |---|---|
    | macOS (Apple silicon) | `polyroot_{{ .Version }}_darwin_arm64.tar.gz` |
    | macOS (Intel) | `polyroot_{{ .Version }}_darwin_amd64.tar.gz` |
    | Linux (x86_64) | `polyroot_{{ .Version }}_linux_amd64.tar.gz` |
    | Linux (ARM64) | `polyroot_{{ .Version }}_linux_arm64.tar.gz` |

    Each archive contains the `polyroot` binary, `LICENSE`, `README.md`, `CHANGELOG.md` and `examples/`.
    Verify a download with `sha256sum -c checksums.txt --ignore-missing` (macOS: `shasum -a 256 -c checksums.txt --ignore-missing`).

    Built with {{ .Env.GOVERSION }} from commit [`{{ .ShortCommit }}`](https://github.com/Kazaz-Or/polyroot/commit/{{ .FullCommit }}).

    ## What's changed
  footer: |
    {{ if .PreviousTag }}**Full changelog**: https://github.com/Kazaz-Or/polyroot/compare/{{ .PreviousTag }}...{{ .Tag }}{{ else }}**Full changelog**: https://github.com/Kazaz-Or/polyroot/commits/{{ .Tag }}{{ end }}
